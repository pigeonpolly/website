<!doctype html><html lang="en"><head><meta charset="utf-8"></head><body>
<script src="../../../site/assets/polly.js"></script>
<script>
// Пиксельные сцены с Полли для контент-завода (scf2611). Холст 160×200, Полли — PollyPet.paint(sp 2) 60×74.
const W = 160, H = 200;
function scene(name) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), w, h); };
  const P = (x, y, col) => R(x, y, 1, 1, col);
  const E = (cx, cy, rx, ry, col) => { for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) P(cx + x, cy + y, col); };
  const polly = (x, y, o = {}) => { const p = document.createElement('canvas'); PollyPet.paint(p, { sp: 2, ...o }); if (o.flip) { g.save(); g.translate(x + p.width, y); g.scale(-1, 1); g.drawImage(p, 0, 0); g.restore(); } else g.drawImage(p, x, y); };
  const txt = (s, x, y, col, px = 1) => { g.fillStyle = col; g.font = `${8 * px}px monospace`; g.fillText(s, x, y); };
  const wall = (a, b) => { R(0, 0, W, 140, a); for (let x = 6; x < W; x += 12) for (let y = 4; y < 140; y += 10) P(x + (y % 20 ? 6 : 0), y, b); };
  const floor = (a, b) => { R(0, 140, W, 60, a); for (let y = 146; y < H; y += 8) R(0, y, W, 1, b); };
  const mug = (x, y, col = '#ffffff') => { R(x, y, 10, 11, col); R(x + 10, y + 2, 3, 1, col); R(x + 12, y + 2, 1, 6, col); R(x + 10, y + 7, 3, 1, col); [1, 4, 7].forEach(i => R(x + i, y + 4, 2, 2, '#d43a3a')); R(x, y, 10, 1, '#6b3b1f'); for (let i = 0; i < 6; i++) P(x + 4 + (i % 2), y - 2 - i, '#ffffffaa'); };
  const sketchbook = (x, y, w, h) => { R(x - 1, y - 1, w + 2, h + 2, '#2a2230'); R(x, y, w, h, '#fbf6ea'); R(x + w / 2, y, 1, h, '#c9bfa9'); };
  const window_ = (x, y, w, h, sky) => { R(x - 2, y - 2, w + 4, h + 4, '#7a5a3e'); R(x, y, w, h, sky); R(x + w / 2 - 1, y, 2, h, '#7a5a3e'); R(x, y + h / 2 - 1, w, 2, '#7a5a3e'); };
  const snow = (n, y1, seed) => { let s = seed; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < n; i++) P(r() * W, r() * y1, '#ffffff'); };
  const garland = (x0, x1, y) => { const cols = ['#E5484D', '#F6C445', '#5BA3D9', '#6A9A3A']; for (let x = x0; x <= x1; x++) { const yy = y + Math.round(3 * Math.sin(Math.PI * ((x - x0) % 26) / 26)); P(x, yy, '#2F5D3A'); if ((x - x0) % 6 === 3) R(x - 1, yy + 1, 2, 2, cols[((x - x0) / 6 | 0) % 4]); } };
  const lamp = (x, y) => { for (let j = 0; j < 56; j++) R(x - 12 - j * .5, y + j, 26 + j, 1, '#fff3c018'); R(x, y, 2, 56, '#3a3030'); R(x - 8, y - 10, 18, 10, '#e9c46a'); R(x - 8, y - 1, 18, 1, '#c99a3a'); };
  const S = {
    // 9: Полли рисует в скетчбуке (каракули праздника)
    doodle() {
      wall('#f3e6d3', '#e8d6bd'); floor('#b07a4e', '#9a6a45'); window_(104, 20, 40, 44, '#29406a'); snow(30, 60, 7); R(104, 20, 40, 44, '#00000000');
      garland(0, W, 8);
      R(10, 128, 140, 6, '#7e5434'); R(16, 134, 4, 40, '#6b4529'); R(140, 134, 4, 40, '#6b4529');
      sketchbook(70, 112, 56, 16); E(84, 120, 4, 4, '#e5484d'); R(83, 114, 2, 3, '#4e7a2e'); E(108, 120, 5, 3, '#f6c445'); R(97, 118, 3, 3, '#5ba3d9'); R(116, 117, 3, 5, '#2f5d3a');
      R(118, 104, 2, 14, '#e9c46a'); P(118, 118, '#333');
      polly(10, 56); mug(130, 114);
    },
    // 11: рождественская ярмарка в Европе
    market() {
      R(0, 0, W, 140, '#1c2a48'); snow(70, 130, 3); for (let i = 0; i < 6; i++) E(20 + i * 28, 16 + (i % 2) * 8, 1, 1, '#fff5d6');
      R(70, 40, 84, 14, '#b3222c'); for (let x = 70; x < 154; x += 12) R(x, 40, 6, 14, '#f4efe6'); R(66, 54, 92, 3, '#6b4529');
      R(74, 57, 4, 80, '#6b4529'); R(146, 57, 4, 80, '#6b4529'); R(74, 100, 76, 40, '#8a5a3a'); R(74, 100, 76, 3, '#6b4529');
      garland(74, 150, 60); [[86, 88], [104, 86], [122, 88]].forEach(([x, y]) => { E(x, y, 5, 6, '#c8642a'); R(x - 3, y - 2, 6, 1, '#ffffff'); P(x - 1, y - 3, '#f6c445'); });
      R(84, 70, 8, 10, '#e9c46a'); R(100, 72, 8, 8, '#e5484d'); R(116, 70, 8, 10, '#6a9a3a');
      R(0, 140, W, 60, '#e8eef6'); for (let x = 0; x < W; x += 9) P(x, 146 + (x % 3), '#c9d6f2');
      polly(14, 70, { hat: 'santa', acc: 'scarf' }); mug(58, 120, '#b3222c');
    },
    // 17: мем — «ещё один слой»
    layer() {
      wall('#efe7dc', '#e2d6c6'); floor('#a7784f', '#8f6542');
      R(96, 60, 3, 90, '#6b4529'); R(140, 60, 3, 90, '#6b4529'); R(92, 140, 56, 3, '#6b4529');
      R(90, 36, 58, 66, '#fbf9f5'); for (let y = 40; y < 98; y++) for (let x = 94; x < 144; x++) { const n = Math.sin(x * .3) + Math.cos(y * .23) + Math.sin((x + y) * .11); P(x, y, n > .8 ? '#6d5a4a' : n > 0 ? '#7a6a52' : n > -.8 ? '#5e5648' : '#8b7b5e'); }
      R(110, 60, 14, 10, '#4b4238'); txt('?', 115, 30, '#2a211c');
      polly(14, 66, { flip: 0 }); R(70, 96, 22, 2, '#c8642a'); R(90, 95, 3, 4, '#2a211c');
      R(20, 150, 16, 8, '#ffffff'); [0, 4, 8, 12].forEach((d, i) => R(21 + d, 151, 3, 3, ['#6d5a4a', '#7a6a52', '#5e5648', '#8b7b5e'][i]));
    },
    // 23: Полли в Wobbleland — рисуется поверх кадра карты (фон — wobble.png)
    wobble() { polly(50, 110, { acc: 'scarf' }); },
    // 25: Полли учит норвежский
    norsk() {
      wall('#e8eef4', '#d5dfe9'); floor('#9a6a45', '#7e5434'); window_(16, 18, 44, 48, '#9fb7d3'); snow(40, 64, 11);
      R(8, 128, 146, 6, '#7e5434');
      R(72, 112, 40, 16, '#f6c445'); R(72, 112, 40, 2, '#2a211c'); txt('Hei!', 78, 124, '#2a211c');
      [['lue', 116, 30, '#e5484d'], ['snø', 116, 52, '#5ba3d9'], ['kakao', 116, 74, '#a0603a']].forEach(([w, x, y, c]) => { R(x, y, 38, 16, '#fbf6ea'); R(x, y, 3, 16, c); txt(w, x + 6, y + 12, '#2a211c'); });
      polly(16, 56, { acc: 'scarf' }); mug(56, 116);
    },
    // 30: 16:00, а уже темно — Полли рисует под лампой
    dark4pm() {
      wall('#2e2a44', '#3a3556'); floor('#4a3a30', '#3d2f27'); window_(18, 16, 46, 50, '#0f1630'); snow(30, 64, 19); E(52, 26, 4, 4, '#fff5d6'); E(54, 25, 3, 3, '#0f1630');
      R(96, 14, 30, 30, '#f4efe6'); E(111, 29, 13, 13, '#fbf9f5'); R(110, 18, 2, 12, '#2a211c'); for (let i = 0; i < 8; i++) R(111 + i * .9, 29 + i * .55, 2, 2, '#2a211c'); txt('16:00', 97, 54, '#e9c46a');
      R(8, 128, 146, 6, '#6b4529'); lamp(138, 72);
      sketchbook(74, 114, 50, 14); E(88, 121, 4, 4, '#e9c46a'); E(110, 121, 5, 3, '#5ba3d9');
      polly(12, 56, { acc: 'scarf' }); mug(56, 116);
    },
  };
  S[name](); return c;
}
window.render = (name, k) => { const c = scene(name), o = document.createElement('canvas'); o.width = W * k; o.height = H * k; const g = o.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(c, 0, 0, W * k, H * k); return o.toDataURL('image/png'); };
</script></body></html>
