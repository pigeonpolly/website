  <p class="topics">buttons and gifts</p>

</section>

    toBag: ['Open the bag', 'Открыть сумку', 'Atvērt somu'], cartGo: ['Keep shopping', 'Выбрать ещё', 'Izvēlēties vēl'],
    soldH: ['Out of stock', 'Нет в наличии', 'Nav pieejams'], catH: ['🛍 Catalog', '🛍 Каталог', '🛍 Katalogs'],
    seedsH: ['🌱 Seeds for the garden', '🌱 Семена для огорода', '🌱 Sēklas dārzam'], seedsNote: ['One seed · how many days it grows · what the harvest sells for. Rare and magic seeds are not sold: they are earned.', 'Цена семечка · сколько дней растёт · за сколько продаётся урожай. Редкие и волшебные не продаются — их получают за серии.', 'Sēklas cena · cik dienas aug · par cik pārdod ražu. Retās un burvju sēklas nepārdod — tās nopelna.'],
    seedBuy: ['+1 for {p} 🔘', '+1 за {p} 🔘', '+1 par {p} 🔘'], seedDays: ['{n} d', '{n} дн.', '{n} d.'], seedGot: ['🌱 +1 · plant it in the garden', '🌱 +1 · посади в огороде', '🌱 +1 · iestādi dārzā'],
    toGarden: ['🥕 To the garden', '🥕 В огород', '🥕 Uz dārzu'], gardenThings: ['🪴 Things for the garden', '🪴 Вещи для огорода', '🪴 Lietas dārzam'],
  };
  var t = function (k) { return T[k][L]; };
  var meEl = document.querySelector('.shop-me'), newBox = document.querySelector('.shop-new'), catBox = document.querySelector('.shop-cat');
  var me = null, owned = {}, shop = {}, LIM = { max: 3, leg: 1 }, LVL = null, NEW = {}, newCards = [], ui = null;
  // фильтры (pp-shop-f) — перенос со старого вида: grp → вкладка, show 'sale' / 'all' → всё (нет в наличии теперь внизу), 'mine' остаётся
  var sv = {}; try { sv = JSON.parse(localStorage.getItem('pp-shop-f') || 'null') || {}; } catch (e) { /* нет хранилища */ }
  var S = { tab: sv.tab || { bird: 'bird', room: 'room', any: 'any', cards: 'cards' }[sv.grp] || 'all', kind: sv.kind || '', theme: sv.theme || '', price: sv.price || '', sort: sv.sort || 'kind', show: sv.show === 'mine' ? 'mine' : '', afford: !!sv.afford, q: '' };
  var saveF = function () { try { localStorage.setItem('pp-shop-f', JSON.stringify({ tab: S.tab, kind: S.kind, theme: S.theme, price: S.price, sort: S.sort, show: S.show, afford: S.afford })); } catch (e) { /* ок */ } };
  // ссылки: /shop/#room, #room:wall (из сумки), #cards, #theme:halloween (витрина сезона)
  function fromHash() {
    var h = decodeURIComponent(location.hash.slice(1)), m = h.split(':');
    if (m[0] === 'theme' && m[1]) { S.theme = m[1]; S.tab = 'all'; S.kind = ''; S.show = ''; S.afford = false; return true; }
    if (['all', 'bird', 'room', 'any', 'cards'].indexOf(m[0]) >= 0) { S.tab = m[0]; S.kind = m[1] || ''; return true; }
    return false;
  }
  fromHash();
  var key = function (k, v) { return k + '|' + v; };
  var row = function (k, v) { return shop[key(k, v)] || { price: 0, stock: 0 }; };
  var isLeg = function (k, v) { var B = window.PPBirds; return !!(B.LEGEND && B.LEGEND.has(key(k, v))); };
  var isSur = function (k, v) { return v === '?' || k === 'any'; };
  var limOf = function (k, v) { return isLeg(k, v) ? LIM.leg : LIM.max; };
  var money = function () { return me && me.btn ? me.btn.buttons : 0; };
  var few = function (k, v, s) { return LVL && s.stock > 0 && s.stock <= (isLeg(k, v) ? LVL.lowLeg : LVL.low); };
  var lots = function (k, v, s) { return LVL && s.stock >= (isLeg(k, v) ? LVL.manyLeg : LVL.many); };

  function head() {
    if (me) {
      var n = window.PPCart ? PPCart.count() : 0;
      meEl.innerHTML = '<b>' + t('have').replace('{n}', money()) + '</b> · <a href="' + pre + '/challenge/#works">' + t('how') + '</a> <button type="button" class="shop-cart-btn' + (n ? ' has' : '') + '">' + t('cartBtn') + (n ? ' · ' + n : '') + '</button>';
      meEl.querySelector('.shop-cart-btn').onclick = openCart;
    } else meEl.textContent = t('login');
  }
  // плитка магазина: вместо отметки — цена; значки «мало», «новое», «у тебя N из 3» (★ легендарной рисует сама плитка)
  function tileOf(k, v) {
    var s = row(k, v), have = owned[key(k, v)] || 0, b = [];
    if (few(k, v, s)) b.push([t('few'), 'few']);
    if (NEW[key(k, v)]) b.push([t('newB'), 'new']);
    if (me && window.PPCart && PPCart.has(k, v)) b.push(['🛒 ' + PPCart.has(k, v), 'cart']);
    if (have && !isSur(k, v)) b.push([have >= limOf(k, v) ? '✓ ' + have + '/' + limOf(k, v) : T.count[L].replace('{n}', have).replace('{m}', limOf(k, v)), 'have']);
    return { badges: b, price: s.stock > 0 ? (s.price ? '🔘 ' + s.price : t('free')) : t('sold'), dim: !(s.stock > 0) };
  }
  // окно вещи: примерка, тема, остаток, «у тебя N из 3», одна кнопка
  function openItem(k, v) {
    var B = window.PPBirds, s = row(k, v), have = owned[key(k, v)] || 0, lim = limOf(k, v), leg = isLeg(k, v), sur = isSur(k, v);
    var th = B.GIFT_THEMES.filter(function (x) { return x[0] !== 'surprise' && x[2].indexOf(key(k, v)) >= 0; }).map(function (x) { return x[1][L]; });
    var lines = [
      th.length ? t('theme').replace('{t}', th.join(', ')) : '',
      s.stock > 0 ? T.left[L].replace('{n}', s.stock).replace(/^./, function (c) { return c.toUpperCase(); }) + (few(k, v, s) ? ' · ' + t('few') : lots(k, v, s) ? ' · ' + t('lots') : '') : t('sold'),
      me && !sur ? T.count[L].replace('{n}', have).replace('{m}', lim).replace(/^./, function (c) { return c.toUpperCase(); }) : '',
      s.stock > 0 && s.base && s.price > s.base ? t('upWhy') : s.stock > 0 && s.base && s.price < s.base ? t('downWhy') : '',
    ];
    var act;
    if (!me) act = { label: t('hatch'), on: function (b, d) { d.close(); if (window.PPAccount) window.PPAccount.openSignIn(); } };
    else if (!(s.stock > 0)) act = { label: t('sold'), disabled: true };
    else if (!sur && have >= lim) act = { label: t('max'), disabled: true };
    else if (money() < s.price) act = { label: T.poorFor[L].replace('{p}', s.price), disabled: true };
    else act = { label: s.price ? T.buyFor[L].replace('{p}', s.price) : t('buyFree'), on: function (b, d) { buy(k, v, s.price, b, d); } };
    var inC = window.PPCart ? PPCart.has(k, v) : 0, cap = capOf(k, v), act2 = null;
    if (me && window.PPCart && cap > 0) act2 = inC >= cap ? { label: t('fullCart').replace('{n}', inC), disabled: true } : { label: inC ? t('moreCart').replace('{n}', inC) : t('toCart'), on: function (b, d) { PPCart.add(k, v); d.close(); cartToast(); if (ui) ui.draw(); } };
    window.PPCatalog.itemWindow({ kind: k, item: v, me: me, legend: leg, lines: lines, note: leg ? t('legend') : '', badges: tileOf(k, v).badges.filter(function (x) { return x[1] !== 'have' && x[1] !== 'cart'; }), action: act, action2: act2 });
  }
  // сколько штук можно положить в корзину: не больше остатка и (кроме сюрпризов) не больше, чем до «у тебя 3 из 3»
  function capOf(k, v) {
    var s = row(k, v);
    if (!(s.stock > 0)) return 0;
    return isSur(k, v) ? s.stock : Math.max(0, Math.min(s.stock, limOf(k, v) - (owned[key(k, v)] || 0)));
  }
  function cartToast() {
    head();
    if (window.PPToast) window.PPToast(t('inCart').replace('{n}', PPCart.count()), { action: t('openCart'), ms: 5000, onAction: openCart });
  }
  // окно корзины: вещи с картинкой, ценой и −/＋, сумма, «Купить всё за N» (покупки по одной через /api/shop/buy)
  var cartDlg = null;
  function openCart() {
    if (!me) { if (window.PPAccount) PPAccount.openSignIn(); return; }
    if (cartDlg && cartDlg.open) return drawCart();
    cartDlg = window.PPCatalog.dialog('cat-cart', '<h2 class="cart-h">' + t('cartH') + '</h2><div class="cart-body"></div>');
    cartDlg.addEventListener('close', function () { cartDlg = null; head(); if (ui) ui.draw(); if (location.hash === '#cart') try { history.replaceState(null, '', '#' + S.tab); } catch (e) { /* ок */ } });
    drawCart();
  }
  function drawCart(msg) {
    if (!cartDlg) return;
    var B = window.PPBirds, C = window.PPCatalog, box = cartDlg.querySelector('.cart-body'), items = PPCart.list(), n = 0, sum = 0;
    box.innerHTML = '';
    if (msg) box.insertAdjacentHTML('beforeend', '<p class="cart-msg">' + msg + '</p>');
    if (!items.length) {
      box.insertAdjacentHTML('beforeend', '<p class="cart-empty">' + t('cartEmpty') + '</p>');
    }
    var ul = document.createElement('ul'); ul.className = 'cart-list';
    items.forEach(function (x) {
      var k = x.kind, v = x.item, s = row(k, v), cap = capOf(k, v), q = Math.min(x.n, cap);
      n += q; sum += q * s.price;
      var li = document.createElement('li'); li.className = 'cart-row' + (cap ? '' : ' off');
      li.appendChild(C.pic(k, v, me.id, 56));
      var tx = document.createElement('div'); tx.className = 'cart-tx';
      tx.innerHTML = '<b></b><span></span>';
      tx.querySelector('b').textContent = B.giftName(k, v, L);
      tx.querySelector('span').textContent = cap ? (s.price ? t('each').replace('{p}', s.price) : t('free')) : (s.stock > 0 ? t('max') : t('sold')) + ' · ' + t('cartOff');
      li.appendChild(tx);
      var qb = document.createElement('div'); qb.className = 'cart-q';
      var minus = document.createElement('button'), num = document.createElement('b'), plus = document.createElement('button'), del = document.createElement('button');
      minus.type = plus.type = del.type = 'button'; minus.textContent = '−'; plus.textContent = '＋'; del.textContent = '✕';
      minus.setAttribute('aria-label', '−1'); plus.setAttribute('aria-label', '+1'); del.setAttribute('aria-label', t('cartDel')); del.className = 'cart-del';
      num.textContent = cap ? q : x.n;
      minus.disabled = !cap || q <= 1; plus.disabled = !cap || q >= cap;
      minus.onclick = function () { PPCart.set(k, v, q - 1); drawCart(); };
      plus.onclick = function () { PPCart.set(k, v, q + 1); drawCart(); };
      del.onclick = function () { PPCart.set(k, v, 0); drawCart(); };
      if (cap) { qb.appendChild(minus); qb.appendChild(num); qb.appendChild(plus); }
      qb.appendChild(del); li.appendChild(qb);
      ul.appendChild(li);
    });
    if (items.length) box.appendChild(ul);
    var foot = document.createElement('div'); foot.className = 'cart-foot';
    if (n) foot.insertAdjacentHTML('beforeend', '<p class="cart-sum"><b>' + t('cartSum').replace('{n}', n).replace('{p}', sum) + '</b><span>' + t('cartHave').replace('{n}', money()) + (money() < sum ? ' · ' + t('cartLack').replace('{p}', sum - money()) : '') + '</span></p>');
    var go = document.createElement('button'); go.type = 'button'; go.className = 'cta-btn cart-buy';
    if (n) {
      go.textContent = money() < sum ? T.poorFor[L].replace('{p}', sum) : t('buyAll').replace('{p}', sum);
      go.disabled = !n || money() < sum;
      go.onclick = function () { buyAll(go); };
    } else { go.textContent = t('cartGo'); go.onclick = function () { cartDlg.close(); }; }
    foot.appendChild(go);
    if (items.length) {
      var cl = document.createElement('button'); cl.type = 'button'; cl.className = 'cart-clear'; cl.textContent = t('cartClear');
      cl.onclick = function () { PPCart.clear(); drawCart(); };
      foot.appendChild(cl);
    }
    box.appendChild(foot);
  }
  // по одной вещи, по очереди; купленное убирается из корзины, некупленное остаётся
  function buyAll(go) {
    var queue = [], got = [], fail = false;
    PPCart.list().forEach(function (x) { var q = Math.min(x.n, capOf(x.kind, x.item)); for (var i = 0; i < q; i++) queue.push(x); });
    go.disabled = true; go.textContent = t('buying');
    cartDlg.querySelectorAll('.cart-q button, .cart-clear').forEach(function (b) { b.disabled = true; });
    function next() {
      var x = queue.shift();
      if (!x) return done();
      var s = row(x.kind, x.item);
      fetch('/api/shop/buy', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: x.kind, item: x.item, price: s.price }) })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (r) {
          if (!r.ok) { fail = true; if (r.d.error === 'poor') queue = []; else queue = queue.filter(function (y) { return y !== x; }); return next(); }
          me.btn.buttons = r.d.buttons; s.stock--;
          var gk = r.d.kind || x.kind, gi = r.d.item || x.item;
          (me.gifts = me.gifts || []).push({ kind: gk, item: gi, status: 'bag', note: 'shop' });
          owned[key(gk, gi)] = (owned[key(gk, gi)] || 0) + 1;
          PPCart.set(x.kind, x.item, PPCart.has(x.kind, x.item) - 1); got.push([gk, gi]);
          next();
        }).catch(function () { fail = true; done(); });
    }
    function done() {
      if (window.PPAccount && PPAccount.setButtons) PPAccount.setButtons(money());
      var msg = got.length ? t('bought').replace('{n}', got.length) : '';
      if (fail) msg += (msg ? ' ' : '') + t('cartRest');
      drawCart(msg);
      if (got.length && window.PPToast) window.PPToast(t('bought').replace('{n}', got.length), { action: t('toBag'), ms: 7000, onAction: function () { location.href = pre + '/bird/#bag'; } });
      load();
    }
    next();
  }
  function buy(kind, item, price, b, d) {
    var B = window.PPBirds; b.disabled = true;
    fetch('/api/shop/buy', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: kind, item: item, price: price }) })
      .then(function (r) { return r.json().then(function (x) { return { ok: r.ok, d: x }; }); })
      .then(function (x) {
        if (!x.ok && x.d.error === 'price') { d.close(); alert(T.changed[L].replace('{p}', x.d.price)); return load(); }
        if (!x.ok) { d.close(); alert(x.d.error === 'poor' ? t('poor') : x.d.error === 'soldout' ? t('sold') : x.d.error === 'limit' ? t('max') : x.d.error === 'all' ? t('all') : t('err')); return load(); }
        d.close();
        var gk = x.d.kind || kind, got = x.d.item || item, room = window.PPCatalog.ROOM_KINDS.indexOf(gk) >= 0;
        if (me) { me.btn.buttons = x.d.buttons; (me.gifts = me.gifts || []).push({ kind: gk, item: got, status: 'bag', note: 'shop' }); }
        // тост «В сумке · Надеть / Поставить сейчас» — useItem (PPCatalog.use)
        if (window.PPToast) window.PPToast((isSur(kind, item) ? '🎲 ' + B.giftName(gk, got, L) + ' — ' : '') + t('inBag'), { action: room ? t('place') : t('putOn'), ms: 7000, onAction: function () { window.PPCatalog.use(gk, got, { me: me, after: load }); } });
        load();
      }).catch(function () { alert(t('err')); b.disabled = false; });
  }
  // «🌱 Семена для огорода» (этап 23): простые семена — тем же POST /api/garden/buy, что и лавка в огороде; рисунки — PPGardenPlants (garden.js)
  var seedBox = document.querySelector('.shop-seeds'), G = null;
  function drawSeeds() {
    var GP = window.PPGardenPlants, P = (G && G.prices) || {}, list = Object.keys(P).filter(function (k) { return P[k].seed != null && GP && GP.CROP[k]; });
    if (!me || !me.nick || !G || !G.owner || !list.length) { seedBox.hidden = true; return; }
    seedBox.hidden = false;
    seedBox.innerHTML = '<h2 class="shop-block-h">' + t('seedsH') + '</h2><p class="shop-seeds-note">' + t('seedsNote') + '</p><div class="shop-seeds-row"></div>'
      + '<p class="shop-seeds-go"><a class="pill-btn" href="' + pre + '/garden/">' + t('toGarden') + '</a> <a class="pill-btn" href="#room:garden">' + t('gardenThings') + '</a></p>';
    var row = seedBox.querySelector('.shop-seeds-row');
    list.forEach(function (k) {
      var x = P[k], have = (G.seeds || {})[k] || 0, d = document.createElement('div'); d.className = 'shop-seed';
      d.innerHTML = '<img src="' + GP.icon(k) + '" alt="" width="40" height="45"><b>' + GP.name(k) + (have ? ' <small>×' + have + '</small>' : '') + '</b><small>' + t('seedDays').replace('{n}', x.days) + ' · → ' + x.sell + ' 🔘</small>';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'pill-btn'; b.textContent = x.seed > 0 ? t('seedBuy').replace('{p}', x.seed) : t('buyFree'); b.disabled = x.seed > money();
      b.onclick = function () {
        b.disabled = true;
        fetch('/api/garden/buy', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ seed: k }) })
          .then(function (r) { if (r.status === 402) throw 'poor'; if (!r.ok) throw 'err'; return r.json(); })
          .then(function (r) { G = r; if (me.btn) me.btn.buttons = r.buttons; if (window.PPAccount && PPAccount.setButtons) PPAccount.setButtons(r.buttons); if (window.PPToast) window.PPToast(t('seedGot'), { action: t('toGarden'), onAction: function () { location.href = pre + '/garden/'; } }); head(); drawSeeds(); })
          .catch(function (e) { alert(e === 'poor' ? t('poor') : t('err')); drawSeeds(); });
      };
      d.appendChild(b); row.appendChild(d);
    });
  }
  // «Новое в магазине» — GET /api/new: вещи в продаже и новые коллекции карточек
  function drawNew() {
    var B = window.PPBirds, C = window.PPCatalog, list = Object.keys(NEW).filter(function (x) { var p = x.split('|'); return row(p[0], p[1]).stock > 0; }).slice(0, 12);
    newBox.innerHTML = '';
    if (!list.length && !newCards.length) { newBox.hidden = true; return; }
    newBox.hidden = false;
    newBox.insertAdjacentHTML('beforeend', '<h2 class="shop-block-h">' + t('newH') + '</h2>');
    // коллекции — одной строкой: подпись и короткие кнопки «название · N», лишнее листается вбок
    var cardsRow = document.createElement('div'); cardsRow.className = 'shop-new-cards-row';
    if (newCards.length) { cardsRow.insertAdjacentHTML('beforeend', '<span class="shop-new-cards-l">' + t('newCards') + '</span>'); newBox.appendChild(cardsRow); }
    newCards.forEach(function (c) {
      var a = document.createElement('button'); a.type = 'button'; a.className = 'shop-new-cards';
      a.textContent = (c.title[['en', 'ru', 'lv'][L]] || c.title.en || c.slug) + ' · ' + c.n;
      a.onclick = function () { try { var f = JSON.parse(localStorage.getItem('pp-cards-f') || '{}') || {}; f.collection = c.slug; localStorage.setItem('pp-cards-f', JSON.stringify(f)); } catch (e) { /* ок */ } ui.setTab('cards'); saveF(); catBox.scrollIntoView({ behavior: 'smooth' }); };
      cardsRow.appendChild(a);
    });
    if (!list.length) return;
    var strip = document.createElement('div'); strip.className = 'shop-new-row';
    list.forEach(function (x) {
      var p = x.split('|'), k = p[0], v = p[1];
      strip.appendChild(C.tile(Object.assign({ kind: k, item: v, name: B.giftName(k, v, L), legend: isLeg(k, v), id: me ? me.id : 2, size: 110, onUse: function () { openItem(k, v); } }, tileOf(k, v))));
    });
    newBox.appendChild(strip);
  }
  function drawCat() {
    var C = window.PPCatalog;
    ui = C.browse(catBox, {
      mode: 'shop', state: S, save: saveF, id: me ? me.id : 2,
      lead: t('rule').replace(/\b3\b/, LIM.max).replace(/\b1\b/, LIM.leg),
      tile: tileOf, onOpen: openItem,
      price: function (k, v) { var s = shop[key(k, v)]; return s ? s.price : null; },
      added: function (k, v) { return NEW[key(k, v)] || (shop[key(k, v)] || {}).added || 0; },
      mine: me ? function (k, v) { return (owned[key(k, v)] || 0) > 0; } : null,
      afford: me ? function (k, v) { var s = row(k, v); return s.stock > 0 && s.price <= money() && (isSur(k, v) || (owned[key(k, v)] || 0) < limOf(k, v)); } : null,
      rest: { title: t('soldH'), test: function (k, v) { return !(row(k, v).stock > 0); } },
      cardsInto: function (c) { c.className = 'pc-sec'; if (window.PPCards) window.PPCards.mount(c); },
      onTab: function (v) { try { history.replaceState(null, '', '#' + v); } catch (e) { /* ок */ } },
      empty: function (st) { return st.show === 'mine' ? t('noneMine') : st.afford ? t('noAfford') : (st.theme || st.kind || st.price || st.q) ? t('noneHere') : t('none'); },
    });
    var h = document.createElement('h2'); h.className = 'shop-block-h shop-cat-h'; h.textContent = t('catH'); catBox.insertBefore(h, catBox.firstChild);
  }
  function load() {
    Promise.all([
      fetch('/api/shop', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : { items: [] }; }).catch(function () { return { items: [] }; }),
      fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
      fetch('/api/new', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    ]).then(function (a) {
      shop = {}; (a[0].items || []).forEach(function (r) { shop[key(r.kind, r.item)] = r; });
      LIM = { max: a[0].max || 3, leg: a[0].legendMax || 1 }; LVL = a[0].lvl || null; // лимиты из «📜 Правил»; «мало / много» — от числа птичек
      me = a[1] && a[1].user ? a[1].user : null; owned = {};
      if (me) (me.gifts || []).forEach(function (g) { if (g.status === 'bag' || g.status === 'new') owned[key(g.kind, g.item)] = (owned[key(g.kind, g.item)] || 0) + 1; });
      NEW = {}; (a[2].items || []).forEach(function (x) { NEW[key(x.kind, x.item)] = x.at; }); newCards = a[2].cards || [];
      if (!me && S.show === 'mine') S.show = '';
      head(); drawNew();
      if (me && me.nick) fetch('/api/garden', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (g) { G = g; drawSeeds(); }).catch(function () {}); else drawSeeds();
      var y = scrollY; drawCat(); scrollTo(0, y); // после покупки список не прыгает
      if (cartDlg) drawCart(cartDlg.querySelector('.cart-msg') ? cartDlg.querySelector('.cart-msg').textContent : '');
      else if (location.hash === '#cart' && me) openCart();
    });
  }
  var hdCart = document.getElementById('hd-cart');
  if (hdCart) hdCart.addEventListener('click', function (e) { if (!me) return; e.preventDefault(); openCart(); });
  addEventListener('pp-cart', function () { if (!cartDlg) head(); });
  addEventListener('hashchange', function () { if (location.hash === '#cart' && me) return openCart(); if (fromHash() && ui) { saveF(); ui.draw(); catBox.scrollIntoView({ behavior: 'smooth' }); } });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load); else load();
})();
</script>
