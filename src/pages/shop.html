<section class="page-head">
  <p class="topics">buttons and gifts</p>
  <h1>Shop</h1>
  <p class="lead">Things for your bird, paid for with buttons 🔘. Quantities are limited: when an item is gone, it’s gone.</p>
  <p class="shop-me"></p>
</section>
<section class="fl-all fl-coll shop" id="shop">
  <div class="fl-coll-bar shop-bar" role="toolbar" aria-label="Filter"></div>
  <div class="fl-coll-box shop-box"></div>
</section>
<script>
// Магазин: каталог вещей (PPBirds.GIFTS, как в «Коллекциях») с ценой и остатком из /api/shop; покупка кладёт вещь в сумку
(function () {
  var L = { ru: 1, lv: 2 }[document.documentElement.lang] || 0, pre = ['', '/ru', '/lv'][L];
  var T = {
    have: ['You have {n} 🔘 buttons', 'У вас {n} 🔘 пуговок', 'Tev ir {n} 🔘 pogas'],
    how: ['How to earn buttons →', 'Как получить пуговки →', 'Kā nopelnīt pogas →'],
    login: ['Sign in to collect buttons and shop.', 'Войдите, чтобы копить пуговки и покупать.', 'Ienāc, lai krātu pogas un iepirktos.'],
    all: ['All', 'Все', 'Visi'], inStock: ['🛍 In stock', '🛍 В продаже', '🛍 Pārdošanā'],
    left: ['{n} left', 'осталось {n}', 'atlikuši {n}'], sold: ['Sold out', 'Нет в наличии', 'Izpārdots'],
    buy: ['Buy', 'Купить', 'Pirkt'], free: ['Free', 'Бесплатно', 'Bez maksas'], mine: ['✓ yours', '✓ уже есть', '✓ jau ir'],
    poor: ['Not enough buttons', 'Не хватает пуговок', 'Nepietiek pogu'],
    ok: ['Bought! It is in your bag 🎒', 'Куплено! Вещь уже в сумке 🎒', 'Nopirkts! Lieta jau ir somā 🎒'],
    sure: ['Buy “{n}” for {p} 🔘?', 'Купить «{n}» за {p} 🔘?', 'Pirkt “{n}” par {p} 🔘?'],
    err: ['Could not buy, please try again.', 'Не получилось купить, попробуйте ещё раз.', 'Neizdevās nopirkt, mēģini vēlreiz.'],
    none: ['Nothing on sale here yet. Check back soon!', 'Здесь пока ничего не продаётся. Загляните позже!', 'Šeit pagaidām nekas netiek pārdots. Ieskaties vēlāk!'],
    onSale: ['🛍 In stock', '🛍 В наличии', '🛍 Pārdošanā'], gone: ['Out of stock', 'Нет в наличии', 'Nav pieejams'],
    count: ['You have {n} of {m}', 'У вас {n} из {m}', 'Tev ir {n} no {m}'], max: ['✓ You have the maximum', '✓ У вас максимум', '✓ Tev ir maksimums'],
    legend: ['★ Legendary: one per bird, cannot be gifted', '★ Легендарная: одна на птичку, дарить нельзя', '★ Leģendāra: viena putniņam, dāvināt nevar'],
    adv: ['📅 Advent', '📅 Адвент', '📅 Advente'], advT: ['Advent windows for “{n}”', 'Окошки адвента для «{n}»', 'Adventes lodziņi lietai “{n}”'],
    advH: ['🔒 Only you see this. Tap the days this thing should be in. If a window has several things, each bird gets one of them at random; an empty window gives buttons. ★ — special windows, the 31st is the legendary one.',
      '🔒 Видите только вы. Отметьте дни, в окошках которых будет эта вещь. Если в окошке несколько вещей, каждой птичке достанется одна из них; пустое окошко даёт пуговки. ★ — особые окошки, 31-е — легендарное.',
      '🔒 Redzi tikai tu. Atzīmē dienas, kuru lodziņos būs šī lieta. Ja lodziņā ir vairākas lietas, katrs putniņš saņem vienu no tām; tukšs lodziņš dod pogas. ★ — īpašie lodziņi, 31. — leģendārais.'],
    advLegend: ['Inside each day you see what is already in that window. Dark — this thing is there.', 'В каждом дне видно, что уже лежит в этом окошке. Тёмный — там эта вещь.', 'Katrā dienā redzams, kas jau ir šajā lodziņā. Tumšs — tur ir šī lieta.'],
    advAdd: ['＋ Add things', '＋ Добавить вещи', '＋ Pievienot lietas'], advIn: ['In this window', 'В этом окошке', 'Šajā lodziņā'],
    advDayH: ['Tap things to put them in this window or take them out. Each bird gets one of them at random.', 'Нажимайте на вещи, чтобы положить их в это окошко или убрать. Каждой птичке достанется одна из них.', 'Pieskaries lietām, lai ieliktu tās šajā lodziņā vai izņemtu. Katrs putniņš saņems vienu no tām.'],
    advEmpty: ['empty — buttons', 'пусто — пуговки', 'tukšs — pogas'], advDec: ['December {d}', '{d} декабря', '{d}. decembris'], done: ['Done', 'Готово', 'Gatavs'],
    rule: ['You can buy up to 3 of the same thing (legendary ones: just 1).', 'Одну и ту же вещь можно купить до 3 штук (легендарные — только 1).', 'Vienu un to pašu lietu var nopirkt līdz 3 gab. (leģendārās — tikai 1).'],
  };
  var bar = document.querySelector('.shop-bar'), box = document.querySelector('.shop-box'), meEl = document.querySelector('.shop-me');
  var me = null, owned = {}, shop = {}, filter = 'all';
  var ADV_SP = [6, 12, 19, 24, 31], plan = null; // админ: что в окошках адвента (как ADVENT_SPECIAL в worker/index.js)
  var advKey = function (k, v) { return k + '|' + v; };
  function advDays(k, v) { return (plan || []).filter(function (p) { return p.kind === k && p.item === v; }).map(function (p) { return p.day; }); }
  function advSet(day, k, v, on) {
    return fetch('/api/admin/advent', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ day: day, kind: k, item: v, on: on }) })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (x) { plan = x.plan; });
  }
  // окно выбора дней для вещи
  function advPick(k, v) {
    var B = window.PPBirds, d = document.createElement('dialog'); d.className = 'fl-adv-dlg';
    var draw2 = function () {
      var on = advDays(k, v);
      d.innerHTML = '<h3>' + T.advT[L].replace('{n}', B.giftName(k, v, L)) + '</h3><p>' + T.advH[L] + ' ' + T.advLegend[L] + '</p><div class="fl-adv-days">' +
        Array.from({ length: 31 }, function (_, i) { var n = i + 1; return '<button type="button" data-d="' + n + '" aria-pressed="' + (on.indexOf(n) >= 0) + '" class="' + (ADV_SP.indexOf(n) >= 0 ? 'sp' : '') + (n === 31 ? ' leg' : '') + '">' + n + (ADV_SP.indexOf(n) >= 0 ? '★' : '') + '</button>'; }).join('') +
        '</div><button type="button" class="pill-btn pill-fill" data-x>' + T.done[L] + '</button>';
      d.querySelector('[data-x]').onclick = function () { d.close(); d.remove(); draw(); };
      // в каждом дне — что уже лежит в этом окошке (картинки, при наведении — названия)
      [].forEach.call(d.querySelectorAll('[data-d]'), function (b) {
        var n = +b.dataset.d, inDay = (plan || []).filter(function (p) { return p.day === n; });
        if (!inDay.length) return;
        b.title = inDay.map(function (p) { return B.giftName(p.kind, p.item, L); }).join(', ');
        var mini = document.createElement('span'); mini.className = 'fl-adv-mini';
        inDay.slice(0, 3).forEach(function (p) { mini.appendChild(B.itemIcon(p.kind, p.item, 22, me ? me.id : 2)); });
        if (inDay.length > 3) { var more = document.createElement('em'); more.textContent = '+' + (inDay.length - 3); mini.appendChild(more); }
        b.appendChild(mini); b.classList.add('has');
      });
      [].forEach.call(d.querySelectorAll('[data-d]'), function (b) { b.onclick = function () { b.disabled = true; advSet(+b.dataset.d, k, v, b.getAttribute('aria-pressed') !== 'true').then(draw2).catch(function () { b.disabled = false; }); }; });
    };
    draw2(); document.body.appendChild(d); d.showModal();
    d.addEventListener('cancel', function () { d.remove(); draw(); });
  }
  // «📅 Адвент»: по датам — что лежит в каждом окошке (✕ убрать)
  function advBoard() {
    var B = window.PPBirds, id = me ? me.id : 2;
    for (var n = 1; n <= 31; n++) {
      var row = document.createElement('div'); row.className = 'fl-adv-row' + (ADV_SP.indexOf(n) >= 0 ? ' sp' : '') + (n === 31 ? ' leg' : '');
      var h = document.createElement('b'); h.textContent = T.advDec[L].replace('{d}', n) + (ADV_SP.indexOf(n) >= 0 ? ' ★' : ''); row.appendChild(h);
      var list = (plan || []).filter(function (p) { return p.day === n; });
      if (!list.length) { var e = document.createElement('small'); e.textContent = T.advEmpty[L]; row.appendChild(e); }
      list.forEach(function (p) {
        var it = document.createElement('span'); it.className = 'fl-adv-it'; it.title = B.giftName(p.kind, p.item, L);
        it.appendChild(B.itemIcon(p.kind, p.item, 44, id));
        var x = document.createElement('button'); x.type = 'button'; x.textContent = '✕'; x.setAttribute('aria-label', '✕ ' + it.title);
        x.onclick = function () { advSet(p.day, p.kind, p.item, false).then(draw); };
        it.appendChild(x); row.appendChild(it);
      });
      // «＋» и клик по дню — выбрать вещи для этого окошка
      var addB = document.createElement('button'); addB.type = 'button'; addB.className = 'fl-adv-add'; addB.textContent = T.advAdd[L];
      addB.onclick = (function (d) { return function () { advDayPick(d); }; })(n); row.appendChild(addB);
      h.onclick = addB.onclick; h.classList.add('fl-adv-day');
      box.appendChild(row);
    }
  }
  // окно дня: весь каталог с фильтрами и поиском, нажатие кладёт вещь в окошко или убирает
  function advDayPick(day) {
    var B = window.PPBirds, d = document.createElement('dialog'), f = 'all', q = '';
    d.className = 'fl-adv-dlg fl-adv-daydlg';
    var render = function () {
      var inDay = (plan || []).filter(function (p) { return p.day === day; }).map(function (p) { return p.kind + '|' + p.item; });
      var th = f.indexOf('theme:') === 0 ? B.GIFT_THEMES.filter(function (t) { return 'theme:' + t[0] === f; })[0] : null;
      var list = [];
      B.GIFT_KINDS.forEach(function (k) {
        if (f.indexOf('kind:') === 0 && f !== 'kind:' + k[0]) return;
        (B.GIFTS[k[0]] || []).forEach(function (v) {
          if (th && th[2].indexOf(k[0] + '|' + v) < 0) return;
          if (f === 'in' && inDay.indexOf(k[0] + '|' + v) < 0) return;
          if (q && B.giftName(k[0], v, L).toLowerCase().indexOf(q) < 0) return;
          list.push([k[0], v]);
        });
      });
      var fbtn = function (k, label) { return '<button type="button" data-f="' + k + '" aria-pressed="' + (f === k) + '">' + label + '</button>'; };
      d.innerHTML = '<h3>' + T.advDec[L].replace('{d}', day) + (ADV_SP.indexOf(day) >= 0 ? ' ★' : '') + '</h3><p>' + T.advDayH[L] + '</p>' +
        '<input type="search" class="fl-adv-q" placeholder="🔍" value="' + q.replace(/"/g, '') + '">' +
        '<div class="fl-adv-f">' + fbtn('in', T.advIn[L] + ' (' + inDay.length + ')') + fbtn('all', T.all[L]) + B.GIFT_KINDS.map(function (k) { return fbtn('kind:' + k[0], k[1][L]); }).join('') + B.GIFT_THEMES.map(function (t) { return fbtn('theme:' + t[0], t[1][L]); }).join('') + '</div>' +
        '<div class="fl-adv-pick"></div><button type="button" class="pill-btn pill-fill" data-x>' + T.done[L] + '</button>';
      var g = d.querySelector('.fl-adv-pick');
      list.forEach(function (kv) {
        var b = document.createElement('button'); b.type = 'button'; b.title = B.giftName(kv[0], kv[1], L); b.setAttribute('aria-pressed', String(inDay.indexOf(kv[0] + '|' + kv[1]) >= 0));
        if (B.LEGEND && B.LEGEND.has(kv[0] + '|' + kv[1])) b.classList.add('leg');
        b.appendChild(B.itemIcon(kv[0], kv[1], 52, me ? me.id : 2));
        var c = document.createElement('small'); c.textContent = b.title; b.appendChild(c);
        b.onclick = function () { b.disabled = true; advSet(day, kv[0], kv[1], b.getAttribute('aria-pressed') !== 'true').then(function () { var y = g.scrollTop; render(); d.querySelector('.fl-adv-pick').scrollTop = y; }).catch(function () { b.disabled = false; }); };
        g.appendChild(b);
      });
      [].forEach.call(d.querySelectorAll('.fl-adv-f [data-f]'), function (b) { b.onclick = function () { f = b.dataset.f; render(); }; });
      var qi = d.querySelector('.fl-adv-q'); qi.oninput = function () { q = qi.value.trim().toLowerCase(); var pos = qi.selectionStart; render(); var n = d.querySelector('.fl-adv-q'); n.focus(); n.setSelectionRange(pos, pos); };
      d.querySelector('[data-x]').onclick = function () { d.close(); d.remove(); draw(); };
    };
    render(); document.body.appendChild(d); d.showModal();
    d.addEventListener('cancel', function () { d.remove(); draw(); });
  }

  function key(k, v) { return k + '|' + v; }
  function buttons() {
    var B = window.PPBirds; if (!B || bar.children.length) return;
    var add = function (k, label, cls) { var b = document.createElement('button'); b.type = 'button'; b.className = 'pill-btn ' + (cls || ''); b.dataset.f = k; b.textContent = label; b.onclick = function () { filter = k; draw(); }; bar.appendChild(b); };
    add('all', T.all[L]);
    B.GIFT_KINDS.forEach(function (k) { add('kind:' + k[0], k[1][L]); });
    var br = document.createElement('span'); br.className = 'fl-coll-br'; bar.appendChild(br);
    B.GIFT_THEMES.forEach(function (t) { add('theme:' + t[0], t[1][L], 'fl-theme'); });
    if (plan) add('advent', T.adv[L], 'fl-adv');
  }
  function head() {
    meEl.innerHTML = '';
    if (me) { meEl.innerHTML = '<b>' + T.have[L].replace('{n}', me.btn ? me.btn.buttons : 0) + '</b> · <a href="' + pre + '/challenge/#works">' + T.how[L] + '</a>'; }
    else meEl.textContent = T.login[L];
  }
  function item(k, v, id, money) {
    var B = window.PPBirds, s = shop[key(k[0], v)] || { price: 0, stock: 0 }, have = owned[key(k[0], v)] || 0, leg = B.LEGEND && B.LEGEND.has(key(k[0], v)), lim = leg ? 1 : 3;
    var t = document.createElement('figure'); t.className = 'fl-coll-item shop-item' + (s.stock > 0 ? '' : ' sold') + (have ? ' got' : '') + (leg ? ' legend' : '');
    t.appendChild(B.giftPic(k[0], v, id, 84, me && me.avatar));
    if (leg) { var lt = document.createElement('span'); lt.className = 'legend-tag'; lt.textContent = '★'; lt.title = T.legend[L]; t.appendChild(lt); }
    var c = document.createElement('figcaption'); c.textContent = B.giftName(k[0], v, L); t.appendChild(c);
    var info = document.createElement('p'); info.className = 'shop-price';
    info.innerHTML = s.stock > 0 ? '<b>' + (s.price ? '🔘 ' + s.price : T.free[L]) + '</b><small>' + T.left[L].replace('{n}', s.stock) + '</small>' : '<small>' + T.sold[L] + '</small>';
    t.appendChild(info);
    if (have) { var m = document.createElement('span'); m.className = 'fl-coll-mark'; m.textContent = have >= lim ? T.max[L] : T.count[L].replace('{n}', have).replace('{m}', lim); t.appendChild(m); }
    if (plan) { // админ: в какие окошки адвента положена вещь
      var ab = document.createElement('button'); ab.type = 'button'; ab.className = 'fl-adv-btn'; var ds = advDays(k[0], v);
      ab.textContent = '📅' + (ds.length ? ' ' + ds.sort(function (a, b) { return a - b; }).join(', ') : ''); ab.classList.toggle('on', !!ds.length);
      ab.onclick = function () { advPick(k[0], v); }; t.appendChild(ab);
    }
    if (s.stock > 0 && me && have < lim) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'pill-btn shop-buy';
      b.textContent = money >= s.price ? T.buy[L] : T.poor[L]; b.disabled = money < s.price;
      b.onclick = function () { buy(k[0], v, s.price, b); }; t.appendChild(b);
    }
    return t;
  }
  function draw() {
    var B = window.PPBirds; if (!B) return;
    buttons(); head();
    [].forEach.call(bar.children, function (b) { if (b.dataset) b.setAttribute('aria-pressed', String(b.dataset.f === filter)); });
    var id = me ? me.id : 2, money = me && me.btn ? me.btn.buttons : 0;
    var theme = filter.indexOf('theme:') === 0 ? B.GIFT_THEMES.filter(function (t) { return 'theme:' + t[0] === filter; })[0] : null;
    box.innerHTML = '';
    if (filter === 'advent') { advBoard(); return; }
    var rule = document.createElement('p'); rule.className = 'fl-all-lead'; rule.textContent = T.rule[L]; box.appendChild(rule);
    // сначала то, что есть в наличии, ниже — чего нет
    [true, false].forEach(function (inStock) {
      var sec = document.createElement('section'); sec.className = 'shop-block' + (inStock ? ' on' : ' off');
      var h2 = document.createElement('h2'); h2.className = 'shop-block-h'; h2.textContent = inStock ? T.onSale[L] : T.gone[L]; sec.appendChild(h2);
      var n = 0;
      B.GIFT_KINDS.forEach(function (k) {
        if (filter.indexOf('kind:') === 0 && filter !== 'kind:' + k[0]) return;
        var list = (B.GIFTS[k[0]] || []).filter(function (v) {
          if (theme && theme[2].indexOf(key(k[0], v)) < 0) return false;
          return ((shop[key(k[0], v)] || {}).stock > 0) === inStock;
        });
        if (!list.length) return;
        var h = document.createElement('h3'); h.textContent = k[1][L]; sec.appendChild(h);
        var g = document.createElement('div'); g.className = 'fl-coll-grid'; sec.appendChild(g);
        list.forEach(function (v) { n++; g.appendChild(item(k, v, id, money)); });
      });
      if (!n && inStock) { var p = document.createElement('p'); p.className = 'fl-all-lead'; p.textContent = T.none[L]; sec.appendChild(p); }
      if (n || inStock) box.appendChild(sec);
    });
  }
  function buy(kind, item, price, b) {
    var B = window.PPBirds;
    if (!confirm(T.sure[L].replace('{n}', B.giftName(kind, item, L)).replace('{p}', price))) return;
    b.disabled = true;
    fetch('/api/shop/buy', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: kind, item: item }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { alert(x.d.error === 'poor' ? T.poor[L] : x.d.error === 'soldout' ? T.sold[L] : x.d.error === 'limit' ? T.max[L] : T.err[L]); return load(); }
        if (window.PPToast) window.PPToast(T.ok[L]);
        load();
      }).catch(function () { alert(T.err[L]); b.disabled = false; });
  }
  function load() {
    Promise.all([
      fetch('/api/shop', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : { items: [] }; }).catch(function () { return { items: [] }; }),
      fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    ]).then(function (a) {
      shop = {}; (a[0].items || []).forEach(function (r) { shop[key(r.kind, r.item)] = r; });
      me = a[1] && a[1].user ? a[1].user : null; owned = {};
      if (me) (me.gifts || []).forEach(function (g) { if (g.status === 'bag' || g.status === 'new') owned[key(g.kind, g.item)] = (owned[key(g.kind, g.item)] || 0) + 1; });
      if (me && me.admin && !plan) return fetch('/api/advent', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (x) { plan = x.plan || []; bar.innerHTML = ''; draw(); });
      draw();
    });
  }
  if (window.PPBirds) load(); else addEventListener('load', load);
})();
</script>
