<section class="page-head">
  <p class="topics">buttons and gifts</p>
  <h1>Shop</h1>
  <p class="lead">Things for your bird, paid for with buttons 🔘. Quantities are limited: when an item is gone, it’s gone.</p>
  <p class="shop-me"></p>
</section>
<section class="fl-all fl-coll shop" id="shop">
  <div class="fl-coll-bar shop-bar" role="toolbar" aria-label="Filter"></div>
  <div class="fl-coll-box shop-box"></div>
</section>
<script>
// Магазин: каталог вещей (PPBirds.GIFTS, как в «Коллекциях») с ценой и остатком из /api/shop; покупка кладёт вещь в сумку
(function () {
  var L = { ru: 1, lv: 2 }[document.documentElement.lang] || 0, pre = ['', '/ru', '/lv'][L];
  var T = {
    have: ['You have {n} 🔘 buttons', 'У вас {n} 🔘 пуговок', 'Tev ir {n} 🔘 pogas'],
    how: ['How to earn buttons →', 'Как получить пуговки →', 'Kā nopelnīt pogas →'],
    login: ['Sign in to collect buttons and shop.', 'Войдите, чтобы копить пуговки и покупать.', 'Ienāc, lai krātu pogas un iepirktos.'],
    all: ['All', 'Все', 'Visi'], inStock: ['🛍 In stock', '🛍 В продаже', '🛍 Pārdošanā'],
    left: ['{n} left', 'осталось {n}', 'atlikuši {n}'], sold: ['Sold out', 'Нет в наличии', 'Izpārdots'],
    buy: ['Buy', 'Купить', 'Pirkt'], free: ['Free', 'Бесплатно', 'Bez maksas'], mine: ['✓ yours', '✓ уже есть', '✓ jau ir'],
    poor: ['Not enough buttons', 'Не хватает пуговок', 'Nepietiek pogu'],
    ok: ['Bought! It is in your bag 🎒', 'Куплено! Вещь уже в сумке 🎒', 'Nopirkts! Lieta jau ir somā 🎒'],
    sure: ['Buy “{n}” for {p} 🔘?', 'Купить «{n}» за {p} 🔘?', 'Pirkt “{n}” par {p} 🔘?'],
    err: ['Could not buy, please try again.', 'Не получилось купить, попробуйте ещё раз.', 'Neizdevās nopirkt, mēģini vēlreiz.'],
    none: ['Nothing on sale here yet. Check back soon!', 'Здесь пока ничего не продаётся. Загляните позже!', 'Šeit pagaidām nekas netiek pārdots. Ieskaties vēlāk!'],
    onSale: ['🛍 In stock', '🛍 В наличии', '🛍 Pārdošanā'], gone: ['Out of stock', 'Нет в наличии', 'Nav pieejams'],
    count: ['You have {n} of {m}', 'У вас {n} из {m}', 'Tev ir {n} no {m}'], max: ['✓ You have the maximum', '✓ У вас максимум', '✓ Tev ir maksimums'],
    legend: ['★ Legendary: one per bird, cannot be gifted', '★ Легендарная: одна на птичку, дарить нельзя', '★ Leģendāra: viena putniņam, dāvināt nevar'],
    fShow: ['Show', 'Показать', 'Rādīt'], sSale: ['🛍 On sale', '🛍 В продаже', '🛍 Pārdošanā'], sMine: ['🎒 What I have', '🎒 Что у меня есть', '🎒 Kas man ir'], sAll: ['Everything', 'Всё', 'Visu'],
    fFor: ['For', 'Для кого', 'Kam'], gBird: ['🐦 For my bird', '🐦 Для птички', '🐦 Putniņam'], gRoom: ['🏠 For the room', '🏠 Для комнаты', '🏠 Istabai'], gAny: ['🎲 Surprises', '🎲 Сюрпризы', '🎲 Pārsteigumi'],
    fKind: ['What', 'Что', 'Kas'], allKinds: ['Any', 'Любое', 'Jebkas'], fTheme: ['Theme', 'Тема', 'Tēma'], anyTheme: ['Any theme', 'Любая тема', 'Jebkura tēma'], reset: ['✕ Reset filters', '✕ Сбросить фильтры', '✕ Notīrīt filtrus'],
    youHave: ['🎒 You have', '🎒 У вас есть', '🎒 Tev ir'], noneMine: ['You have nothing like this yet.', 'У вас пока нет таких вещей.', 'Tev vēl nav tādu lietu.'],
    noneHere: ['Nothing on sale with these filters. Try another theme or “Everything”.', 'С такими фильтрами ничего нет в продаже. Попробуйте другую тему или «Всё».', 'Ar šiem filtriem nekas netiek pārdots. Pamēģini citu tēmu vai “Visu”.'],
    up: ['▲ few left', '▲ осталось мало', '▲ maz palicis'], down: ['▼ plenty', '▼ много в наличии', '▼ daudz'],
    upWhy: ['Few left, so the price went up', 'Осталось мало — поэтому дороже', 'Palicis maz — tāpēc dārgāk'], downWhy: ['Plenty in stock, so it is cheaper', 'Много в наличии — поэтому дешевле', 'Daudz noliktavā — tāpēc lētāk'],
    changed: ['The price has just changed: now {p} 🔘. Take a look and buy again.', 'Цена только что изменилась: теперь {p} 🔘. Посмотрите и купите ещё раз.', 'Cena tikko mainījās: tagad {p} 🔘. Paskaties un pērc vēlreiz.'],
    rule: ['You can buy up to 3 of the same thing (legendary ones: just 1). Prices follow the stock: the fewer left, the pricier; the more in stock, the cheaper.', 'Одну и ту же вещь можно купить до 3 штук (легендарные — только 1). Цена зависит от остатка: чем меньше осталось, тем дороже, чем больше — тем дешевле.', 'Vienu un to pašu lietu var nopirkt līdz 3 gab. (leģendārās — tikai 1). Cena atkarīga no atlikuma: jo mazāk palicis, jo dārgāk; jo vairāk, jo lētāk.'],
  };
  var bar = document.querySelector('.shop-bar'), box = document.querySelector('.shop-box'), meEl = document.querySelector('.shop-me');
  var me = null, owned = {}, shop = {};
  // фильтры: что показать (в продаже / моё / всё), для кого (птичке / комнате / сюрпризы), вид вещи, тема
  var F = { show: 'sale', grp: 'all', kind: '', theme: '' };
  try { var sv = JSON.parse(localStorage.getItem('pp-shop-f') || 'null'); if (sv) F = Object.assign(F, sv); } catch (e) { /* нет хранилища */ }
  var saveF = function () { try { localStorage.setItem('pp-shop-f', JSON.stringify(F)); } catch (e) { /* ок */ } };
  function key(k, v) { return k + '|' + v; }
  function grpOf(k) { var B = window.PPBirds; return k === 'any' ? 'any' : (B.ROOM_KINDS || []).indexOf(k) >= 0 ? 'room' : 'bird'; }
  function buttons() {
    var B = window.PPBirds; bar.innerHTML = '';
    var row = function (label, cls) { var r = document.createElement('div'); r.className = 'shop-row' + (cls ? ' ' + cls : ''); if (label) { var l = document.createElement('span'); l.className = 'shop-lab'; l.textContent = label; r.appendChild(l); } var g = document.createElement('div'); g.className = 'shop-opts'; r.appendChild(g); bar.appendChild(r); return g; };
    var pill = function (g, f, val, label) { var b = document.createElement('button'); b.type = 'button'; b.className = 'pill-btn'; b.textContent = label; b.setAttribute('aria-pressed', String(F[f] === val)); b.onclick = function () { F[f] = val; if (f === 'grp') F.kind = ''; saveF(); draw(); }; g.appendChild(b); };
    var g1 = row(T.fShow[L], 'shop-seg'); pill(g1, 'show', 'sale', T.sSale[L]); pill(g1, 'show', 'mine', T.sMine[L]); pill(g1, 'show', 'all', T.sAll[L]);
    var g2 = row(T.fFor[L], 'shop-seg'); pill(g2, 'grp', 'all', T.all[L]); pill(g2, 'grp', 'bird', T.gBird[L]); pill(g2, 'grp', 'room', T.gRoom[L]); pill(g2, 'grp', 'any', T.gAny[L]);
    if (F.grp === 'bird' || F.grp === 'room') {
      var g3 = row(T.fKind[L], 'shop-kinds'); pill(g3, 'kind', '', T.allKinds[L]);
      B.GIFT_KINDS.forEach(function (k) { if (grpOf(k[0]) === F.grp) pill(g3, 'kind', k[0], k[1][L]); });
    }
    var g4 = row(T.fTheme[L]), sel = document.createElement('select'); sel.className = 'shop-theme';
    sel.innerHTML = '<option value="">' + T.anyTheme[L] + '</option>' + B.GIFT_THEMES.filter(function (t) { return t[0] !== 'surprise'; }).map(function (t) { return '<option value="' + t[0] + '">' + t[1][L] + '</option>'; }).join('');
    sel.value = F.theme; if (sel.value !== F.theme) F.theme = '';
    sel.onchange = function () { F.theme = sel.value; saveF(); draw(); }; g4.appendChild(sel);
    if (F.theme || F.kind || F.grp !== 'all') { var rs = document.createElement('button'); rs.type = 'button'; rs.className = 'shop-reset'; rs.textContent = T.reset[L]; rs.onclick = function () { F.grp = 'all'; F.kind = ''; F.theme = ''; saveF(); draw(); }; g4.appendChild(rs); }
  }
  function head() {
    meEl.innerHTML = '';
    if (me) { meEl.innerHTML = '<b>' + T.have[L].replace('{n}', me.btn ? me.btn.buttons : 0) + '</b> · <a href="' + pre + '/challenge/#works">' + T.how[L] + '</a>'; }
    else meEl.textContent = T.login[L];
  }
  function item(k, v, id, money) {
    var B = window.PPBirds, s = shop[key(k[0], v)] || { price: 0, stock: 0 }, have = owned[key(k[0], v)] || 0, leg = B.LEGEND && B.LEGEND.has(key(k[0], v)), lim = leg ? 1 : 3;
    var t = document.createElement('figure'); t.className = 'fl-coll-item shop-item' + (s.stock > 0 ? '' : ' sold') + (have ? ' got' : '') + (leg ? ' legend' : '');
    t.appendChild(B.giftPic(k[0], v, id, 84, me && me.avatar));
    if (leg) { var lt = document.createElement('span'); lt.className = 'legend-tag'; lt.textContent = '★'; lt.title = T.legend[L]; t.appendChild(lt); }
    var c = document.createElement('figcaption'); c.textContent = B.giftName(k[0], v, L); t.appendChild(c);
    var info = document.createElement('p'); info.className = 'shop-price';
    var trend = s.base && s.price > s.base ? '<small class="shop-up" title="' + T.upWhy[L] + '">' + T.up[L] + '</small>' : s.base && s.price < s.base ? '<small class="shop-down" title="' + T.downWhy[L] + '">' + T.down[L] + '</small>' : '';
    info.innerHTML = s.stock > 0 ? '<b>' + (s.price ? '🔘 ' + s.price : T.free[L]) + '</b>' + trend + '<small>' + T.left[L].replace('{n}', s.stock) + '</small>' : '<small>' + T.sold[L] + '</small>';
    t.appendChild(info);
    if (have) { var m = document.createElement('span'); m.className = 'fl-coll-mark'; m.textContent = have >= lim ? T.max[L] : T.count[L].replace('{n}', have).replace('{m}', lim); t.appendChild(m); }
    if (s.stock > 0 && me && have < lim) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'pill-btn shop-buy';
      b.textContent = money >= s.price ? T.buy[L] : T.poor[L]; b.disabled = money < s.price;
      b.onclick = function () { buy(k[0], v, s.price, b); }; t.appendChild(b);
    }
    return t;
  }
  function draw() {
    var B = window.PPBirds; if (!B) return;
    if (F.show === 'mine' && !me) F.show = 'sale';
    buttons(); head();
    var id = me ? me.id : 2, money = me && me.btn ? me.btn.buttons : 0;
    var theme = F.theme ? B.GIFT_THEMES.filter(function (t) { return t[0] === F.theme; })[0] : null;
    var stock = function (k, v) { return (shop[key(k, v)] || {}).stock > 0; };
    box.innerHTML = '';
    var rule = document.createElement('p'); rule.className = 'fl-all-lead'; rule.textContent = T.rule[L]; box.appendChild(rule);
    // блоки: «В продаже», «У вас есть», «Всё» = в продаже + нет в наличии
    var blocks = F.show === 'mine' ? [['mine', T.youHave[L]]] : F.show === 'sale' ? [['on', T.onSale[L]]] : [['on', T.onSale[L]], ['off', T.gone[L]]];
    blocks.forEach(function (bl) {
      var sec = document.createElement('section'); sec.className = 'shop-block ' + bl[0];
      var h2 = document.createElement('h2'); h2.className = 'shop-block-h'; h2.textContent = bl[1]; sec.appendChild(h2);
      var n = 0;
      B.GIFT_KINDS.forEach(function (k) {
        if (F.grp !== 'all' && grpOf(k[0]) !== F.grp) return;
        if (F.kind && F.kind !== k[0]) return;
        var list = (bl[0] === 'mine' ? B.GIFTS[k[0]] || [] : B.withSurprise ? B.withSurprise(k[0]) : B.GIFTS[k[0]] || []).filter(function (v) {
          if (theme && theme[2].indexOf(key(k[0], v)) < 0) return false;
          return bl[0] === 'mine' ? owned[key(k[0], v)] > 0 : stock(k[0], v) === (bl[0] === 'on');
        });
        if (!list.length) return;
        var h = document.createElement('h3'); h.textContent = k[1][L]; sec.appendChild(h);
        var g = document.createElement('div'); g.className = 'fl-coll-grid'; sec.appendChild(g);
        list.forEach(function (v) { n++; g.appendChild(item(k, v, id, money)); });
      });
      if (!n && bl[0] !== 'off') { var p = document.createElement('p'); p.className = 'fl-all-lead'; p.textContent = bl[0] === 'mine' ? T.noneMine[L] : (F.theme || F.kind || F.grp !== 'all') ? T.noneHere[L] : T.none[L]; sec.appendChild(p); }
      else if (n) { var c = document.createElement('small'); c.className = 'shop-n'; c.textContent = ' · ' + n; h2.appendChild(c); }
      if (n || bl[0] !== 'off') box.appendChild(sec);
    });
  }
  function buy(kind, item, price, b) {
    var B = window.PPBirds;
    if (!confirm(T.sure[L].replace('{n}', B.giftName(kind, item, L)).replace('{p}', price))) return;
    b.disabled = true;
    fetch('/api/shop/buy', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ kind: kind, item: item, price: price }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok && x.d.error === 'price') { alert(T.changed[L].replace('{p}', x.d.price)); return load(); }
        if (!x.ok) { alert(x.d.error === 'poor' ? T.poor[L] : x.d.error === 'soldout' ? T.sold[L] : x.d.error === 'limit' ? T.max[L] : T.err[L]); return load(); }
        if (window.PPToast) window.PPToast(item === '?' && x.d.item ? '🎲 ' + B.giftName(kind, x.d.item, L) + ' — ' + T.ok[L] : T.ok[L]);
        load();
      }).catch(function () { alert(T.err[L]); b.disabled = false; });
  }
  function load() {
    Promise.all([
      fetch('/api/shop', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : { items: [] }; }).catch(function () { return { items: [] }; }),
      fetch('/api/me', { credentials: 'same-origin' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }),
    ]).then(function (a) {
      shop = {}; (a[0].items || []).forEach(function (r) { shop[key(r.kind, r.item)] = r; });
      me = a[1] && a[1].user ? a[1].user : null; owned = {};
      if (me) (me.gifts || []).forEach(function (g) { if (g.status === 'bag' || g.status === 'new') owned[key(g.kind, g.item)] = (owned[key(g.kind, g.item)] || 0) + 1; });
      draw();
    });
  }
  if (window.PPBirds) load(); else addEventListener('load', load);
})();
</script>
