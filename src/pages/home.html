<section class="hero">
  <div class="hero-text">
    <p class="topics">art &middot; creativity &middot; technologies</p>
    <h1>A small lab for big imagination</h1>
    <p class="lead">Watercolors, sketchbooks and illustrated worlds, daily drawing challenges and a little bit of tech magic, all under one roof.</p>
    <div class="actions">
      <a class="btn btn-join" href="/flock/" data-join>🐦 Join and get your bird</a>
    </div>
  </div>
  <div class="art" tabindex="0">
    <div class="frame" role="img" aria-label="Pigeon Polly as an astronaut planting sunflowers, an illustration by Alina Otkinska"></div>
    <div class="frame frame-me" aria-hidden="true"></div>
    <svg class="star" viewBox="-48 -48 96 96" aria-hidden="true"><path d="M0 -48 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z"/></svg>
    <span class="dot dot-1"></span>
    <span class="dot dot-2"></span>
  </div>
</section>
<script>
// фото Алины под Полли: наведение на компьютере, касание на телефоне
(function () { var a = document.querySelector('.hero .art'); if (a) a.addEventListener('click', function () { a.classList.toggle('on'); }); })();
// «Присоединиться»: гостю — окно входа (регистрация = вход через Google), вошедшему — его профиль
(function () {
  var b = document.querySelector('[data-join]'); if (!b) return;
  var pre = { ru: '/ru', lv: '/lv' }[document.documentElement.lang] || '';
  b.addEventListener('click', function (e) {
    if (window.PPAccount && window.PPAccount.signedIn()) { e.preventDefault(); location.href = pre + '/bird/'; return; }
    if (window.PPAccount && window.PPAccount.openSignIn()) e.preventDefault();
  });
})();
</script>
