<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#2B1A51">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/site.js" defer></script>
</head>
<body class="{{body_class}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="brand" href="/">
    <svg class="brand-star" viewBox="-48 -48 96 96" aria-hidden="true"><path d="M0 -48 l14 34 34 14 -34 14 -14 34 -14 -34 -34 -14 34 -14z"/></svg>
    <span>Pigeon Polly <em>Art Lab</em></span>
  </a>
  <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  <nav id="site-nav" class="site-nav" aria-label="Main">
    <ul>
{{nav}}
    </ul>
  </nav>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
  <p>© Alina Otkinska · Pigeon Polly Art Lab</p>
  <p class="footer-links">
    <a href="https://lv.linkedin.com/in/otkinska" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://www.patreon.com/cw/pigeon_polly" target="_blank" rel="noopener">Patreon</a>
    <a href="https://www.pinterest.com/pigeonpollyart/" target="_blank" rel="noopener">Pinterest</a>
  </p>
</footer>
</body>
</html>
