<style>
  html, body { margin: 0; background: #FFFFFF; }
  .books {
    box-sizing: border-box; padding: 56px 64px;
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center;
    font-family: 'Karla', sans-serif; color: #2B1A51;
  }
  .kicker { margin: 0 0 10px; font-family: 'Fraunces', serif; font-style: italic; font-size: 22px; color: #D85A30; }
  h2 { margin: 0 0 18px; font-family: 'Fraunces', serif; font-weight: 600; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.1; }
  .txt { margin: 0 0 12px; max-width: 44ch; font-size: 17px; line-height: 1.7; color: #4A3E68; }
  .hint { margin: 18px 0 0; font-size: 15px; color: #8C7FB0; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .mine { cursor: pointer; }
  .mine > g { transition: transform .25s; transform-box: fill-box; transform-origin: center; }
  .mine:hover > g { transform: translateX(-18px); }
  .mine:focus-visible { outline: 3px solid #D85A30; outline-offset: 4px; }
  @media (max-width: 820px) {
    .books { grid-template-columns: 1fr; gap: 36px; padding: 48px 26px; }
    .pile { order: -1; }
  }
</style>

<section class="books">
  <div>
    <p class="kicker">Written and painted by me</p>
    <h2>Sketching guides from my own desk</h2>
    <p class="txt">Short, practical books for people who want to start sketching, not to be perfect. Watercolor, ink, and the small habits that keep a sketchbook alive.</p>
    <p class="txt">More guides are on the way.</p>
    <p class="hint">Click a coloured book to open it.</p>
  </div>
