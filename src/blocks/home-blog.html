<style>
  .hb { padding: 56px var(--gutter) 60px; background: #FFFDF8; color: #2B1A51; }
  .hb[hidden] { display: none; }
  .hb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .hb-top h2 { margin: 0; font: 600 clamp(28px, 3.2vw, 40px)/1.1 var(--serif); color: #2B1A51; }
  .hb-kick { margin: 0 0 6px; font: italic 400 18px var(--serif); color: #D85A30; }
  .hb-all { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px; border: 2px solid #2B1A51; color: #2B1A51; font: 700 16px/1 var(--sans); text-decoration: none; transition: background .2s, color .2s, transform .2s; white-space: nowrap; }
  .hb-all:hover, .hb-all:focus-visible { background: #2B1A51; color: #FFFDF8; transform: translateY(-1px); }
  .hb-top { align-items: center; }
  .hb-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 48px; align-items: start; }
  /* новая (или 📌 закреплённая) статья: картинка слева, текст и кнопка справа */
  .hb-main { display: grid; grid-template-columns: minmax(0, 11fr) minmax(0, 9fr); gap: 32px; align-items: center; color: inherit; text-decoration: none; }
  .hb-main .hb-img { aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; background: #EDE8F7; display: grid; place-items: center; font-size: 56px; box-shadow: 0 14px 34px rgba(43, 26, 81, .14); }
  .hb-main img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .hb-main:hover img { transform: scale(1.03); }
  .hb-txt { display: block; }
  .hb-meta { margin: 0 0 8px; font: 600 14px var(--sans); color: #7A6F99; }
  .hb-main h3 { margin: 0 0 12px; font: 700 clamp(22px, 2.2vw, 30px)/1.2 var(--article, serif); color: #2B1A51; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .hb-main:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .hb-main p.hb-ex { margin: 0 0 20px; font: 17px/1.6 var(--article, serif); color: #4A3F6B; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .hb-more { display: inline-block; padding: 12px 24px; border-radius: 999px; background: #F0A987; color: #2B1A51; font: 800 16px/1 var(--sans); box-shadow: 0 5px 0 #B0573A; transition: transform .15s; }
  .hb-main:hover .hb-more { transform: translateY(-2px); }
  /* избранное справа: до трёх */
  .hb-side { border-left: 1px solid #ECE6F5; padding-left: 32px; }
  .hb-side h3.hb-fav { margin: 0 0 16px; font: 700 15px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: #E9A93B; }
  .hb-side ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .hb-side a { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; color: inherit; text-decoration: none; padding: 8px; margin: -8px; border-radius: 14px; transition: background .2s; }
  .hb-side a:hover { background: #F3EEFB; }
  .hb-side .hb-th { width: 84px; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: #EDE8F7; display: grid; place-items: center; font-size: 24px; }
  .hb-side img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hb-side b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: 700 16px/1.3 var(--article, serif); color: #2B1A51; }
  .hb-side small { display: block; margin-top: 4px; font: 600 13px var(--sans); color: #7A6F99; }
  .hb-solo .hb-grid { grid-template-columns: 1fr; }
  .hb-solo .hb-main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); max-width: 1160px; gap: 44px; }
  .hb-solo .hb-main .hb-img { aspect-ratio: 16 / 10; }
  .hb-none .hb-side { display: none; }
  .hb-soon { display: flex; gap: 28px; align-items: center; padding: 28px 32px; border-radius: 18px; background: #F3EEFB; }
  .hb-soon h3 { margin: 0 0 8px; font: 600 clamp(22px, 2.4vw, 30px)/1.2 var(--serif); color: #2B1A51; }

  .hb-soon-pic { font-size: 48px; flex: none; }
  @media (max-width: 1100px) { .hb-grid { grid-template-columns: 1fr; gap: 36px; } .hb-side { border-left: 0; padding-left: 0; border-top: 1px solid #ECE6F5; padding-top: 28px; } .hb-side ol { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
  @media (max-width: 700px) {
    .hb { padding-top: 40px; padding-bottom: 44px; }
    .hb-top { margin-bottom: 20px; }
    .hb-main, .hb-solo .hb-main { grid-template-columns: 1fr; gap: 16px; }
    .hb-main .hb-img, .hb-solo .hb-main .hb-img { aspect-ratio: 16 / 10; }
    .hb-main h3 { font-size: 24px; }
    .hb-main p.hb-ex { font-size: 16px; margin-bottom: 18px; -webkit-line-clamp: 3; }
    .hb-more { padding: 12px 22px; font-size: 15px; }
    .hb-all { padding: 10px 18px; font-size: 15px; }
  }
  @media (max-width: 700px) { .hb-soon { flex-direction: column; text-align: center; padding: 24px 18px; } }
</style>
