# Раз в неделю: копия картинок сайта (блог, галереи, карточки) из Cloudflare в backup/media/ этого репозитория.
# Ошибка (что-то не скачалось) — GitHub пришлёт письмо владельцу репозитория.
name: Копия картинок сайта
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать новые картинки
        run: python3 tools/media_backup.py
      - name: Сохранить в репозиторий
        if: always()
        run: |
          git config user.name "media-backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup/media
          git diff --cached --quiet || (git commit -m "Копия картинок сайта [skip ci]" && git push)
